{% extends 'base.html' %}
{% block content %}
<div class="container mt-1">
    <div class="card mx-auto" style="max-width: 800px;">
        <div class="card-body p-4">
            <h2 class="mb-3">Contact Us</h2>
            <p class="mb-3">{{ content|safe }}</p>
            <div class="row">
                <div class="col-md-7 pe-md-4">
                    <form method="post">
                        {% csrf_token %}
                        <input type="text" name="name" class="form-control mb-2" placeholder="Name" required>
                        <input type="email" name="email" class="form-control mb-2" placeholder="Email" required>
                        <textarea name="message" class="form-control mb-3" placeholder="Message" rows="4" required></textarea>
                        <button type="submit" class="btn btn-primary">Send</button>
                    </form>
                </div>
                <div class="col-md-5 mt-4 mt-md-0">
                    <div class="ps-md-3 border-start">
                        <h3 class="h5 font-weight-bold">E-Mail</h3>
                        <p>ecr_rentals@gmail.com</p>
                        <h3 class="h5 font-weight-bold">Phone</h3>
                        <p>+974 1234 5678</p>
                        <h3 class="h5 font-weight-bold">Follow Us</h3>
                        <div>
                            <a href="https://www.facebook.com/MaxVerstappen" target="_blank"><img src="/static/images/facebook.svg" alt="Facebook" class="contact-icons"></a>
                            <a href="https://x.com/ECarsReport" target="_blank"><img src="/static/images/twitter.svg" alt="Twitter" class="contact-icons"></a>
                            <a href="https://www.instagram.com/pixarcars/" target="_blank"><img src="/static/images/instagram.svg" alt="Instagram" class="contact-icons"></a>
                            <a href="https://www.youtube.com/watch?v=oaEM4JYFPfw" target="_blank"><img src="/static/images/youtube.svg" alt="YouTube" class="contact-icons"></a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="card mt-4 mx-auto" style="max-width: 800px;">
        <div class="card-body p-4">
            <h2 class="mb-3 text-center">Our Location</h2>
            <div style="height: 400px;">
                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3608.4894667073186!2d51.542823299999995!3d25.254115!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3e45cf910e08feb3%3A0xd4aa7a447cd2c7d0!2zQVBURUNIIFFBVEFSIENPTVBVVEVSIEVEVUNBVElPTiBDRU5UUkUgV0xMIC0g2KPYqNiq2YrZgyDZgti32LEg2YTYqti52YTZitmFINin2YTYrdin2LPZiNioINiwLtmFLtmF!5e0!3m2!1sen!2sqa!4v1744205301145!5m2!1sen!2sqa" 
                width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
            </div>
        </div>
    </div>
</div>
{% endblock %}
