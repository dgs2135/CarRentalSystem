{% extends 'base.html' %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow-sm border-0 rounded-lg">
                <div class="card-body p-4">
                    <h2 class="text-center mb-4">Post a Testimonial</h2>
                    <form method="post" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-4">
                            <textarea name="content" id="content" class="form-control" required rows="5" placeholder="Write a Review..."></textarea>
                        </div>
                        <div class="mb-4">
                            <label for="image" class="form-label h6">Add a Photo (Optional)</label>
                            <div class="input-group">
                                <input type="file" name="image" 
                                       id="image" 
                                       class="form-control" 
                                       accept="image/*"
                                       style="height: auto;">
                            </div>
                        </div>
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary">Submit
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
