{% extends 'base.html' %}
{% block content %}
    <h2>Booking History</h2>
    <table class="table">
        <thead>
            <tr>
                <th>Vehicle</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            {% for booking in bookings %}
                <tr>
                    <td>{{ booking.vehicle }}</td>
                    <td>{{ booking.start_date }}</td>
                    <td>{{ booking.end_date }}</td>
                    <td style="color:red; font-weight: bold;">{{ booking.status }}</td>
                </tr>
            {% empty %}
                <tr><td colspan="4">No bookings yet.</td></tr>
            {% endfor %}
        </tbody>
    </table>
{% endblock %}
